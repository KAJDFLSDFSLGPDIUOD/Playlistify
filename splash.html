<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playlistify</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f5f1ff;font-family:system-ui,"Segoe UI",sans-serif;background:radial-gradient(70% 90% at 90% 0%,rgba(180,108,255,.4),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(109,47,224,.4),transparent 60%),#050309;-webkit-app-region:drag;user-select:none}
.disc{width:68px;height:68px;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#090510 0 2px,#2a1d46 2px 3px);animation:spin 2.4s linear infinite;box-shadow:0 0 30px rgba(180,108,255,.55)}
.disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:conic-gradient(from 20deg,#ff5ad9,#6d2fe0,#b46cff,#ff5ad9)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:21px;margin:4px 0 0;font-weight:700}
p{margin:0;font-size:13px;color:#a094bd;min-height:1.3em}
.bar{width:270px;height:6px;border-radius:99px;background:rgba(180,108,255,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff5ad9,#b46cff);transition:width .25s}
.bar.ind i{width:40%;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
</style>
</head>
<body>
<div class="disc"></div>
<h1 id="t">Checking for updates…</h1>
<div class="bar ind" id="b"><i id="f"></i></div>
<p id="s"></p>
<script>
function setStatus(title, sub, pct) {
  document.getElementById('t').textContent = title;
  document.getElementById('s').textContent = sub || '';
  var b = document.getElementById('b'), f = document.getElementById('f');
  if (pct == null) { b.className = 'bar ind'; f.style.width = ''; }
  else { b.className = 'bar'; f.style.width = Math.max(2, Math.min(100, pct)) + '%'; }
}
</script>
</body>
</html>
